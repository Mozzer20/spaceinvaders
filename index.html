<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>Space Invaders</title>
  <meta name="description" content="A fan recreation of classic Space Invaders. Play on phone or desktop — arcade controls, high scores on this device." />
  <meta name="theme-color" content="#05070a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Invaders" />
  <meta name="format-detection" content="telephone=no" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png" />
  <link rel="icon" type="image/png" sizes="512x512" href="icon-512.png" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="crt-on">
  <div class="cabinet">
    <header class="masthead">
      <div class="mast-left">
        <h1>SPACE INVADERS</h1>
        <p class="tag">fan recreation · 1978 arcade · this device</p>
      </div>
      <div class="mast-right">
        <button type="button" id="btn-crt" class="ghost" aria-pressed="true" title="Toggle CRT scanlines">CRT</button>
      </div>
    </header>

    <div class="stage-wrap">
      <div class="stage" id="stage">
        <canvas id="game" width="672" height="768" aria-label="Space Invaders game"></canvas>
        <div class="scanlines" aria-hidden="true"></div>
        <div class="bezel" aria-hidden="true"></div>
      </div>
    </div>

    <div class="pad" id="pad">
      <div class="pad-cluster move">
        <button type="button" class="arcade" id="btn-left" aria-label="Move left">◀</button>
        <button type="button" class="arcade" id="btn-right" aria-label="Move right">▶</button>
      </div>
      <div class="pad-cluster mid">
        <button type="button" class="arcade small" id="btn-start" aria-label="Start">START</button>
        <button type="button" class="arcade small" id="btn-pause" aria-label="Pause">PAUSE</button>
      </div>
      <div class="pad-cluster fire">
        <button type="button" class="arcade fire-btn" id="btn-fire" aria-label="Fire">FIRE</button>
      </div>
    </div>
  </div>

  <div id="name-entry" class="overlay hidden" role="dialog" aria-modal="true" aria-labelledby="entry-title">
    <div class="overlay-card">
      <p class="overlay-kicker">THIS DEVICE</p>
      <h2 id="entry-title">NEW HIGH SCORE</h2>
      <p class="entry-score" id="entry-score">00000</p>
      <p class="entry-label">ENTER INITIALS</p>
      <div class="initials" id="initials">
        <div class="letter-col" data-i="0">
          <button type="button" class="chev" data-dir="up" aria-label="Previous letter">▲</button>
          <button type="button" class="letter" data-i="0">A</button>
          <button type="button" class="chev" data-dir="down" aria-label="Next letter">▼</button>
        </div>
        <div class="letter-col" data-i="1">
          <button type="button" class="chev" data-dir="up" aria-label="Previous letter">▲</button>
          <button type="button" class="letter" data-i="1">A</button>
          <button type="button" class="chev" data-dir="down" aria-label="Next letter">▼</button>
        </div>
        <div class="letter-col" data-i="2">
          <button type="button" class="chev" data-dir="up" aria-label="Previous letter">▲</button>
          <button type="button" class="letter" data-i="2">A</button>
          <button type="button" class="chev" data-dir="down" aria-label="Next letter">▼</button>
        </div>
      </div>
      <p class="entry-help">TAP ▲▼ · TYPE A–Z · START / FIRE TO SAVE</p>
      <button type="button" class="arcade save-btn" id="btn-save-score">PUT ON TABLE</button>
    </div>
  </div>

  <script src="js/audio.js"></script>
  <script src="js/sprites.js"></script>
  <script src="js/game.js"></script>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./sw.js").catch(() => {});
      });
    }
  </script>
</body>
</html>
