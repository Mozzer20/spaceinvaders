<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Space Invaders</title>
  <meta name="description" content="A fan recreation of classic Space Invaders in the browser." />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="crt">
    <header class="masthead">
      <h1>SPACE INVADERS</h1>
      <p class="tag">fan recreation · 1978 arcade classic</p>
    </header>
    <div class="stage">
      <canvas id="game" width="672" height="768" aria-label="Space Invaders game"></canvas>
    </div>
    <p class="hint">← → or A D to move · SPACE to fire · P to pause · ENTER to start</p>
  </div>
  <script src="js/audio.js"></script>
  <script src="js/sprites.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
